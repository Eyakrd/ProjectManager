<div class="min-h-screen bg-gray-50 p-8">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Gestion des Projets</h1>
    <button (click)="openAddModal()"
            class="flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-sm font-semibold rounded-xl transition-all duration-200 cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Ajouter un projet
    </button>
  </div>

  @if (selectedProject) {
    <app-edit-project [project]="selectedProject" (cancelEdit)="onCancelEdit()" (saveEdit)="onSaveEdit($event)" />
  }

  @if (!selectedProject) {
    <div class="flex gap-2 mb-4">
      <button (click)="view = 'list'"
              [class]="view === 'list' ? 'px-4 py-1.5 text-sm font-semibold bg-blue-600 text-white rounded-lg'
                                 : 'px-4 py-1.5 text-sm font-semibold bg-white text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50'">
        Liste
      </button>
      <button (click)="view = 'kanban'"
              [class]="view === 'kanban' ? 'px-4 py-1.5 text-sm font-semibold bg-blue-600 text-white rounded-lg'
                                   : 'px-4 py-1.5 text-sm font-semibold bg-white text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50'">
        Kanban
      </button>
    </div>

    @if (view === 'list') {
      <app-project-list [projects]="projects" (editProject)="onEditProject($event)" (projectsChange)="onProjectsLoaded($event)" />
    }
    @if (view === 'kanban') {
      <app-project-kanban [projects]="projects" (editProject)="onEditProject($event)" (projectsChange)="onProjectsLoaded($event)" />
    }
  }

</div>

@if (showAddModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" (click)="closeAddModal()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="modal-panel relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl z-[60]"
         style="max-height: 90vh; overflow-y: auto;" (click)="$event.stopPropagation()">
      <button (click)="closeAddModal()"
              class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer z-20">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <app-add-project (projectAdded)="onProjectAdded($event)" (cancelled)="closeAddModal()" />
    </div>
  </div>
}
